spring:
  application:
    name: challenge-server

  datasource:
    url: jdbc:postgresql://localhost:5432/challenge
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

jwt:
  # JWT_SECRET 환경변수 필수 (최소 256비트/32바이트). 미설정 시 기동 실패.
  # 로컬 개발은 셸 export 또는 .env 로드로 주입할 것. 디폴트 제공하지 않음.
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 3600000      # 1 hour
  refresh-token-expiration-ms: 1209600000  # 14 days

# Kakao API (ADR-0008, SDK 방식).
# - api-base-url: kapi.kakao.com — 모바일이 SDK로 받은 access_token으로 /v2/user/me 호출.
# - 코드↔토큰 교환(/oauth/token)은 SDK가 클라이언트에서 끝내므로 서버에는 rest-api-key/client-secret/redirect-uri 가 필요 없다.
# 통합 테스트에서는 api-base-url을 WireMock URL로 override (@DynamicPropertySource).
kakao:
  api-base-url: ${KAKAO_API_BASE_URL:https://kapi.kakao.com}
  webclient:
    connect-timeout-ms: 2000
    read-timeout-ms: 5000

# 애플리케이션 고유 설정 (`challenge.*`). dev.test-login.enabled 도 이 네임스페이스다.
challenge:
  fcm:
    # Firebase 서비스 계정 비공개 키(JSON)의 **절대 경로**.
    #
    # 🔴 기본값이 빈 문자열이고 그게 지금 정상 상태다 — 키가 없으면 NoOpNotificationSender 로
    #    떨어져 **발송만** 건너뛴다. 서버는 정상 기동하고 notifications row 저장·엔드포인트는
    #    전부 동작한다 (계약 §0.4). 잘못된 경로·손상된 JSON 도 기동을 막지 않는다(경고 로그만).
    # 🔴 이 파일은 레포 **밖**에 둔다. .gitignore 의 *-adminsdk-*.json 등은 실수 방어이지
    #    보관 위치가 아니다.
    credentials-path: ${FCM_CREDENTIALS_PATH:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    disable-swagger-default-url: true

logging:
  level:
    org.hibernate.SQL: debug
