spring:
  application:
    name: challenge-server

  datasource:
    url: jdbc:postgresql://localhost:5432/challenge
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # 인증 사진 multipart 업로드 (challenge-verification 계약 §3, ADR-0011 §3 개정).
  #
  # 🔴 **여기가 사진 크기의 유일한 강제 지점이다.** 초과분은 컨트롤러에 도달하기 전에
  #    MaxUploadSizeExceededException 으로 끊기고, GlobalExceptionHandler 가 code 700 으로 바꾼다.
  #    앱은 ~500KB 로 리사이즈해 올린다(spec T-M2) — 5MB 는 그 목표치가 아니라 **방어선**이다.
  # request-size 가 file-size 보다 큰 것은 multipart 경계·헤더 오버헤드 몫이다.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080

jwt:
  # JWT_SECRET 환경변수 필수 (최소 256비트/32바이트). 미설정 시 기동 실패.
  # 로컬 개발은 셸 export 또는 .env 로드로 주입할 것. 디폴트 제공하지 않음.
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 3600000      # 1 hour
  refresh-token-expiration-ms: 1209600000  # 14 days

# Kakao API (ADR-0008, SDK 방식).
# - api-base-url: kapi.kakao.com — 모바일이 SDK로 받은 access_token으로 /v2/user/me 호출.
# - 코드↔토큰 교환(/oauth/token)은 SDK가 클라이언트에서 끝내므로 서버에는 rest-api-key/client-secret/redirect-uri 가 필요 없다.
# 통합 테스트에서는 api-base-url을 WireMock URL로 override (@DynamicPropertySource).
kakao:
  api-base-url: ${KAKAO_API_BASE_URL:https://kapi.kakao.com}
  webclient:
    connect-timeout-ms: 2000
    read-timeout-ms: 5000

# 애플리케이션 고유 설정 (`challenge.*`). dev.test-login.enabled 도 이 네임스페이스다.
challenge:
  fcm:
    # Firebase 서비스 계정 비공개 키(JSON)의 **절대 경로**.
    #
    # 🔴 기본값이 빈 문자열이고 그게 지금 정상 상태다 — 키가 없으면 NoOpNotificationSender 로
    #    떨어져 **발송만** 건너뛴다. 서버는 정상 기동하고 notifications row 저장·엔드포인트는
    #    전부 동작한다 (계약 §0.4). 잘못된 경로·손상된 JSON 도 기동을 막지 않는다(경고 로그만).
    # 🔴 이 파일은 레포 **밖**에 둔다. .gitignore 의 *-adminsdk-*.json 등은 실수 방어이지
    #    보관 위치가 아니다.
    credentials-path: ${FCM_CREDENTIALS_PATH:}

  # 인증 사진 저장 (ADR-0011 — 서버 로컬 폴더 + PhotoStorage 포트).
  #
  # 🔴 FCM 과 달리 **fail-safe 로 떨어지지 않는다.** 푸시는 없어도 앱이 동작하지만 사진 저장은
  #    없으면 인증 자체가 불가능하다. 저장 루트를 못 만들면 기동 시점에 터진다.
  #
  # 🔴 서명 비밀값이 더는 필요 없다 — 조회 서명 URL 폐기(2026-08-18 2차 결정)로 서명 체계가
  #    통째로 사라졌다. CHALLENGE_PHOTO_SIGNING_SECRET / CHALLENGE_PHOTO_PUBLIC_BASE_URL
  #    환경변수도 함께 소멸했다. 사진 접근은 일반 JWT 인증 엔드포인트가 한다.
  photo:
    # 저장 루트. 🔴 레포 **밖**이 기본값이다 — ./ 아래면 git status 에 사진이 뜨고
    # ./gradlew clean 이 지울 수 있다. "재기동 후에도 사진이 보인다"(spec 수용 기준)가
    # 기본값 상태에서 성립해야 한다.
    # 상대 경로는 서버 실행 디렉터리(challenge-server/) 기준 — ../challenge-image 는
    # challenge/ 아래의 형제 폴더다.
    storage-root: ${CHALLENGE_PHOTO_ROOT:../challenge-image}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    disable-swagger-default-url: true

logging:
  level:
    org.hibernate.SQL: debug
