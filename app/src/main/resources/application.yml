spring:
  application:
    name: challenge-server

  datasource:
    url: jdbc:postgresql://localhost:5432/challenge
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

jwt:
  # JWT_SECRET 환경변수 필수 (최소 256비트/32바이트). 미설정 시 기동 실패.
  # 로컬 개발은 셸 export 또는 .env 로드로 주입할 것. 디폴트 제공하지 않음.
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 3600000      # 1 hour
  refresh-token-expiration-ms: 1209600000  # 14 days

# Kakao OAuth (ADR-0008).
# - auth-base-url: kauth.kakao.com (인가/토큰 교환)
# - api-base-url:  kapi.kakao.com  (사용자 정보 조회)
# - rest-api-key / redirect-uri: 디벨로퍼 콘솔에서 발급 후 환경변수로 주입 (필수, 미설정 시 기동 실패)
# - client-secret: 콘솔에서 활성화한 경우만 값이 들어감. 비활성이면 빈 문자열로 남겨두면 됨.
# 통합 테스트에서는 base-url들을 WireMock URL로 override (@DynamicPropertySource).
kakao:
  auth-base-url: ${KAKAO_AUTH_BASE_URL:https://kauth.kakao.com}
  api-base-url: ${KAKAO_API_BASE_URL:https://kapi.kakao.com}
  rest-api-key: ${KAKAO_REST_API_KEY}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  webclient:
    connect-timeout-ms: 2000
    read-timeout-ms: 5000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    disable-swagger-default-url: true

logging:
  level:
    org.hibernate.SQL: debug
